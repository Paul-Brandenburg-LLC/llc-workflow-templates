name: Gate 2 Codex (Reusable)

# PB LLC §3.4 Gate 2 — Cross-Vendor-Reviewer-Bridge.
# Reusable-Workflow: Repos pinnen via:
#   jobs:
#     bridge:
#       uses: Paul-Brandenburg-LLC/llc-workflow-templates/.github/workflows/gate-2-codex.yml@v1
#       secrets: inherit

on:
  workflow_call:
    inputs:
      use_app_token:
        description: 'GitHub App-Token für Auto-Push verwenden (Anti-Loop-Schutz)'
        type: boolean
        default: true
        required: false
      bot_exempt_extra_contexts:
        # PB LLC §3.4 v7.1.0 Bot-PR-Konklusivitaets-Pflicht: Governance-Contexts, die
        # dieser Reusable auf Bot-PRs zentral auf success (bot-exempt) setzt, zusaetzlich
        # zu gate-2-codex/bridge/pr-template-gate/review. Repos mit e2e-Required-Check
        # uebergeben 'e2e'. Leerzeichen-separiert.
        description: 'Zusätzliche Status-Contexts für den bot-exempt-Pfad (z. B. "e2e")'
        type: string
        default: ''
        required: false
      extra_doc_only_regex:
        # PB LLC §3.4 v7.0.4 Render-PR-Regel (Realitäts-Audit 2026-07-06): erlaubt einem
        # Consumer, weitere Pfade als doc-only zu deklarieren, die Codex nicht braucht
        # (z.B. gerenderte Spec-HTML). Render-PRs #295/#298 hingen an der Bot-PR-Mention-
        # Lücke, weil ihr Diff hier nicht als doc-only durchging. Leer = kein Extra-Match.
        # ⚠ DEPRECATED seit v1.8.0: deploybare Endungen (html/php/css/js/…) sind per
        # DENY-FIRST NIE doc-only, egal was hier steht; Spec-Publish-PRs laufen ueber
        # den bot-exempt-Klassenpfad. Der Input bleibt nur, damit Consumer, die ihn noch
        # uebergeben (Hub), beim Bump nicht am workflow_call-Schema scheitern.
        description: 'DEPRECATED (v1.8.0, deny-first): Zusätzliches Regex (bash =~) für doc-only; deploybare Endungen matchen nie'
        type: string
        default: ''
        required: false

permissions:
  pull-requests: read
  statuses: write
  contents: read

concurrency:
  group: gate-2-codex-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  bridge:
    if: >-
      (github.event_name == 'pull_request') ||
      (github.event_name == 'pull_request_review' && github.event.review.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve PR HEAD
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          # --- Bot-PR-Konklusivitaets-Pflicht (PB LLC §3.4 v7.1.0; Klassen-Gate v1.8.0) ---
          # Governance-Gates enden auf Bot-PRs konklusiv mit success (bot-exempt) —
          # ein skipped/ewig-pending Required-Check haelt den Merge-Knopf fuer immer zu
          # (Befund 2026-07-18: 244 unmergebare Bot-PRs org-weit). Event-unabhaengig,
          # damit spaetere review/comment-Events das success nicht mit pending
          # ueberschreiben. Merge-Entscheidung bleibt beim Sweep.
          #
          # Seit v1.8.0 ist die Ausnahme ein KLASSEN-Gate statt Autor-Gate: der Autor
          # allein exemptete JEDEN Diff des Bots — auch einen, der Code aendert. Jetzt
          # muss der PR einer der vier gemessenen Bot-Werkslinien entsprechen (Branch +
          # ggf. Titel + Diff-Pfade). Faellt ein Bot-PR durch, blockiert nichts: er
          # laeuft durchs normale Codex-Tor und wartet auf ein Verdict.
          PRJSON=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          AUTHOR=$(printf '%s' "$PRJSON" | jq -r .user.login)
          BRANCH=$(printf '%s' "$PRJSON" | jq -r .head.ref)
          TITLE=$(printf '%s' "$PRJSON"  | jq -r .title)

          # --- Geteilte Diff-Pruefung is_pin_bump (PB LLC §3.4 v7.0.5) ----------------
          # EINE Definition fuer beide Steps (Klassen-Gate hier, Scope-Skip unten),
          # via $RUNNER_TEMP-Lib. BYTE-IDENTISCH zu scripts/gate-2-doc-only-selftest.sh.
          cat > "$RUNNER_TEMP/gate2-lib.sh" <<'LIB'
          is_pin_bump() {
            local JSON nfiles bad i patch line body key major addf rmf
            JSON="$(cat)"
            nfiles=$(printf '%s' "$JSON" | jq 'length')
            case "$nfiles" in ''|*[!0-9]*) echo false; return;; esac
            [ "$nfiles" -gt 0 ] || { echo false; return; }
            # (a) jede geaenderte Datei ist ein Workflow-File
            bad=$(printf '%s' "$JSON" | jq -r '[.[] | select((.filename|test("^\\.github/workflows/[^/]+\\.ya?ml$"))|not)] | length')
            [ "$bad" = "0" ] || { echo false; return; }
            addf="$(mktemp)"; rmf="$(mktemp)"
            i=0
            while [ "$i" -lt "$nfiles" ]; do
              patch=$(printf '%s' "$JSON" | jq -r ".[$i].patch // \"\"")
              while IFS= read -r line; do
                case "$line" in
                  '+++'*|'---'*|'@@'*|' '*|'') : ;;
                  '+'*|'-'*)
                    # (b) jede +/- Zeile MUSS eine Org-Reusable-uses-Zeile mit Semver-Tag sein:
                    #     Reusable-Workflow (workflows/<f>.yml, Job-Ebene) ODER Composite
                    #     Action (actions/<name>, Step-Ebene mit Listen-'- ') — P1 Runde 4.
                    if ! printf '%s\n' "$line" | grep -qE '^[-+][[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*Paul-Brandenburg-LLC/llc-workflow-templates/\.github/(workflows/[A-Za-z0-9._-]+\.ya?ml|actions/[A-Za-z0-9._-]+)@v[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$'; then
                      command rm -f "$addf" "$rmf"; echo false; return
                    fi
                    body=${line:1}
                    major=$(printf '%s' "$body" | sed -E 's/.*@v([0-9]+)\.[0-9]+\.[0-9]+[[:space:]]*$/\1/')
                    key=$(printf '%s' "$body" | sed -E 's/@v[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$//')
                    case "$line" in
                      '+'*) printf '%s\t%s\n' "$key" "$major" >> "$addf" ;;
                      '-'*) printf '%s\t%s\n' "$key" "$major" >> "$rmf"  ;;
                    esac
                    ;;
                  *) : ;;
                esac
              done <<< "$patch"
              i=$((i + 1))
            done
            # (e) mind. je eine +/- Zeile; (c)+(d) Multiset (key,major): added == removed
            if [ -s "$addf" ] && [ -s "$rmf" ] && diff <(sort "$addf") <(sort "$rmf") >/dev/null; then
              command rm -f "$addf" "$rmf"; echo true
            else
              command rm -f "$addf" "$rmf"; echo false
            fi
          }
          LIB
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/gate2-lib.sh"

          lade_diff() {  # fuellt FILES_JSON (alle Diff-Dateien inkl. .patch) genau einmal
            local erwartet geladen
            if [ -z "${FILES_JSON:-}" ]; then
              FILES_JSON=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" | jq -s '(add // [])')
              # Fail-closed (P1 Runde 2): der files-Endpunkt liefert hoechstens 3000
              # Eintraege — stimmt die Zahl nicht mit changed_files des PR ueberein,
              # ist der Diff unvollstaendig und darf NIE eine Exempt-Klasse belegen
              # (leeres Array laesst jede Diff-Pruefung scheitern).
              erwartet=$(printf '%s' "$PRJSON" | jq -r '.changed_files // -1')
              geladen=$(printf '%s' "$FILES_JSON" | jq 'length')
              if [ "$geladen" != "$erwartet" ]; then FILES_JSON='[]'; fi
            fi
          }
          alle_patches_vorhanden() {  # true, wenn der Diff >0 Dateien hat und JEDE einen Patch traegt
            local n ohne
            lade_diff
            n=$(printf '%s' "$FILES_JSON" | jq 'length')
            case "$n" in ''|*[!0-9]*) return 1 ;; esac
            [ "$n" -gt 0 ] || return 1
            # Fail-closed (P1 Runde 2): binaere oder zu grosse Dateien haben kein
            # .patch-Feld — ihr Inhalt ist unpruefbar, also keine Exempt-Klasse.
            ohne=$(printf '%s' "$FILES_JSON" | jq -r '[.[] | select((.patch // "") == "")] | length')
            [ "$ohne" = "0" ]
          }
          alle_dateien_unter() {  # $1=Pfad-Regex; true, wenn der Diff >0 Dateien hat und JEDE matcht
            local n bad
            lade_diff
            n=$(printf '%s' "$FILES_JSON" | jq 'length')
            case "$n" in ''|*[!0-9]*) return 1 ;; esac
            [ "$n" -gt 0 ] || return 1
            # Renames (P1 Runde 3): auch der ALTE Pfad muss die Grenze einhalten —
            # sonst schoebe ein status:renamed z.B. einen Workflow nach tasks/.
            bad=$(printf '%s' "$FILES_JSON" | jq -r --arg re "$1" '[.[] | select( ((.filename|test($re))|not) or (((.previous_filename // .filename)|test($re))|not) )] | length')
            [ "$bad" = "0" ]
          }
          patch_zeilen_nur() {  # $1=Zeilen-Regex; true, wenn es +/- Patchzeilen gibt und JEDE matcht
            local lines
            lade_diff
            lines=$(printf '%s' "$FILES_JSON" | jq -r '.[].patch // ""' | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' || true)
            [ -n "$lines" ] || return 1
            ! printf '%s\n' "$lines" | grep -qvE "$1"
          }

          BOT_EXEMPT=false
          case "$AUTHOR" in
            'dependabot[bot]')
              # (1) Dependabot arbeitet ausschliesslich auf eigenen Branches.
              case "$BRANCH" in dependabot/*) BOT_EXEMPT=true ;; esac ;;
            'pb-llc-auto-fix-bot[bot]')
              if printf '%s\n' "$BRANCH" | grep -qE '^chore/pin-bump-[A-Za-z0-9._-]+-v[0-9]+\.[0-9]+\.[0-9]+$' \
                 && printf '%s\n' "$TITLE" | grep -qiE 'pin|bump'; then
                # (2a) Workflow-Pin-Welle (propagate-templates.yml; seed-/auto-sync-
                #      Branches fallen BEWUSST durch — sie tragen echte Workflow-Diffs).
                #      Diff-Gegenprobe: der GESAMTE Patch muss ein reiner Tag-Bump sein;
                #      alle Dateien muessen einen pruefbaren Patch tragen (fail-closed).
                if alle_patches_vorhanden \
                   && [ "$(printf '%s' "$FILES_JSON" | is_pin_bump)" = "true" ]; then
                  BOT_EXEMPT=true
                fi
              elif [ "$BRANCH" = "chore/plugin-pin-bump" ] \
                 && printf '%s\n' "$TITLE" | grep -qE '^chore\(plugin\): bump pin to v[0-9]+\.[0-9]+\.[0-9]+$' \
                 && alle_dateien_unter '^CLAUDE\.md$' \
                 && alle_patches_vorhanden \
                 && patch_zeilen_nur '^[+-]plugin_version: "[0-9]+\.[0-9]+\.[0-9]+"$'; then
                # (2b) Plugin-Pin-Welle (auto-pin-bump.yml): Diff darf NUR die
                #      plugin_version-Zeile in CLAUDE.md drehen (gemessen an
                #      freiestimme-net-site#124).
                BOT_EXEMPT=true
              elif printf '%s\n' "$BRANCH" | grep -qE '^bot/publish-specs-[0-9]+$' \
                 && alle_dateien_unter '^llc-checkliste-deploy/specs/'; then
                # (3) Spec-Publish (Hub). MUSS exempt bleiben: haengt der Publish-PR,
                #     steht der Render-Beweis aus -> Drift-Lock org-weit (Publish-Deadlock).
                BOT_EXEMPT=true
              elif printf '%s\n' "$BRANCH" | grep -qE '^chore/cloud-dispatch-[0-9]{8}-[0-9]{6}$' \
                 && alle_dateien_unter '^tasks/'; then
                # (4) Cloud-Dispatch-State (gemessen an llc-ops-backlog#1100/#1101:
                #     Diff ausschliesslich tasks/*.yml).
                BOT_EXEMPT=true
              fi ;;
          esac
          echo "bot_exempt=$BOT_EXEMPT" >> "$GITHUB_OUTPUT"

      # NUR Dependabot-getriggerte Runs haben ein read-only GITHUB_TOKEN → dort
      # App-Token aus den Org-DEPENDABOT-Secrets (APP_ID/APP_PRIVATE_KEY gespiegelt
      # 2026-07-18). Für andere Bot-Autoren (pb-llc-auto-fix-bot-PRs) hat das normale
      # GITHUB_TOKEN statuses:write — der App-Token hätte es NICHT (403-Befund
      # blockzocker#257: App-Permissions sind Contents+PR only, §4).
      - name: Mint App-Token für Bot-exempt-Status (nur Dependabot-Runs)
        if: steps.head.outputs.bot_exempt == 'true' && github.actor == 'dependabot[bot]'
        id: app-token
        uses: actions/create-github-app-token@df432ceedc7162793a195dd1713ff69aefc7379e # v2.0.6
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Set status — Bot-exempt (PB LLC §3.4 v7.1.0)
        if: steps.head.outputs.bot_exempt == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          EXTRA_CONTEXTS: ${{ inputs.bot_exempt_extra_contexts }}
        run: |
          set -euo pipefail
          # Zentraler Status-Post fuer ALLE Governance-Contexts: die per-Repo-Jobs
          # (pr-template-gate, review) skippen sich auf Bot-PRs bzw. haben keine
          # Secrets — ein Required-Context wird aber auch durch einen Commit-Status
          # gleichen Namens erfuellt (Bridge-Pattern). So braucht die Adoption keine
          # review.yml-Aenderung pro Repo (Self-Mod-Lock §16.10).
          for ctx in gate-2-codex bridge pr-template-gate review $EXTRA_CONTEXTS; do
            gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/${{ steps.head.outputs.sha }}" \
              -f state=success -f context="$ctx" \
              -f description="bot-exempt (§3.4 v7.1.0) — Test-Checks bleiben massgeblich"
          done

      - name: Scope Skip — Doc-only / Pin-Bump (PB LLC §3.4 v5.8 M2 + v7.0.5)
        id: scope
        # --- Ereignis-UNABHAENGIG (v1.9.0, llc-ops-backlog#87) --------------------
        # Frueher stand hier zusaetzlich `github.event_name == 'pull_request'`. Das
        # machte JEDEN Doc-only-PR der Org dauerhaft unmergebar: Codex schreibt
        # kurz nach dem Oeffnen seinen Zusammenfassungs-Kommentar, die Bruecke
        # laeuft darauf als `issue_comment` erneut — und dieser Step lief dann
        # nicht. `outputs.skip` blieb LEER; leer ist nicht `'true'`, also
        # passierten die beiden folgenden Steps ihren Waechter (`skip != 'true'`),
        # die Bruecke fiel in den Codex-Urteilszweig und ueberschrieb ihr eigenes,
        # korrektes `success` mit `pending`. Gruen wurde es nie wieder: der Code
        # rechnet mit einem folgenden `pull_request_review`-Event, aber ein Review
        # OHNE Befund gibt es bei Codex nicht (nur eine 👍-Reaktion). Deadlock.
        # Doc-only ist eine Eigenschaft des DIFFS, nicht des Ausloesers — dieselbe
        # Begruendung, aus der der Step "Resolve PR HEAD" oben schon
        # ereignis-unabhaengig laeuft. Der Job-`if` deckt die Ereignisauswahl
        # bereits ab (issue_comment nur an PRs und nur vom Codex-Bot).
        # Beweis: scripts/gate-2-verdict-selftest.sh (Faelle S1/S2).
        if: steps.head.outputs.bot_exempt != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EXTRA_DOC_ONLY_REGEX: ${{ inputs.extra_doc_only_regex }}
        run: |
          set -euo pipefail

          # --- Pin-Bump-Erkennung (PB LLC §3.4 v7.0.5) ------------------------------
          # true, wenn der GESAMTE Diff ausschliesslich den Versions-Tag bestehender
          # Org-Reusable-uses-Zeilen in .github/workflows/*.yml aendert (kein Ziel-/
          # with:-/Zeilen-Wechsel, kein Major-Bump, keine weiteren Hunks/Dateien).
          # Definition kommt aus der geteilten Lib, die der Step "Resolve PR HEAD"
          # nach $RUNNER_TEMP schreibt (BYTE-IDENTISCH zu scripts/gate-2-doc-only-
          # selftest.sh; seit v1.8.0 nutzt auch das bot-exempt-Klassen-Gate sie).
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/gate2-lib.sh"

          FILES=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
          DOC_ONLY=1
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # DENY-FIRST (v1.8.0): deploybare Endungen sind NIE doc-only — auch dann
            # nicht, wenn EXTRA_DOC_ONLY_REGEX sie matcht. Ein Render-Regex, das .html
            # abdeckt, truege sonst jeden beliebigen Code-Diff am Codex-Tor vorbei.
            # (Spec-Publish-PRs des Hubs laufen seit v1.8.0 ueber den bot-exempt-Pfad,
            # Klasse 3 — sie brauchen dieses Loch nicht mehr.)
            if [[ "$f" =~ \.(html?|php|css|js|mjs|cjs|ts|tsx|jsx|vue|svelte|py|rb|sql|sh|bash)$ ]]; then
              DOC_ONLY=0; break
            fi
            # Eine Datei ist doc-only, wenn sie eines der Standard-Muster ODER (falls gesetzt)
            # das Consumer-Extra-Regex matcht (PB LLC §3.4 v7.0.4 Render-PR-Regel).
            if [[ ! "$f" =~ \.(md|markdown)$ ]] && \
               [[ ! "$f" =~ ^docs/ ]] && \
               [[ ! "$f" =~ ^CHANGELOG ]] && \
               [[ ! "$f" =~ ^\.github/ISSUE_TEMPLATE/ ]] && \
               [[ ! "$f" =~ ^feedback_.*\.md$ ]] && \
               { [ -z "$EXTRA_DOC_ONLY_REGEX" ] || [[ ! "$f" =~ $EXTRA_DOC_ONLY_REGEX ]]; }; then
              DOC_ONLY=0; break
            fi
          done <<< "$FILES"
          if [ "$DOC_ONLY" = "1" ]; then
            DIFF=$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY")
            if echo "$DIFF" | grep -qE '^[+-]version:'; then
              DOC_ONLY=0
            fi
          fi

          SKIP=false; REASON=""
          if [ "$DOC_ONLY" = "1" ]; then
            SKIP=true; REASON="Doc-only skip"
          else
            PATCHES=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --paginate | jq -s '(add // [])')
            # Fail-closed (P1 Runde 5): Dateien ohne .patch (binaer/zu gross) sind
            # unpruefbar und duerfen den Pin-Bump-Skip nicht passieren.
            OHNE_PATCH=$(printf '%s' "$PATCHES" | jq -r '[.[] | select((.patch // "") == "")] | length')
            if [ "$OHNE_PATCH" = "0" ] && [ "$(printf '%s' "$PATCHES" | is_pin_bump)" = "true" ]; then
              SKIP=true; REASON="pin-bump-skip (§3.4 v7.0.5)"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: Set status — Scope Skip (Doc-only / Pin-Bump)
        if: steps.scope.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          set -euo pipefail
          echo "Gate 2 skip: $REASON"
          # Status unter BEIDEN Contexts posten: 'gate-2-codex' (Status-Name) und
          # 'bridge' (= Job-Name; manche Repos haben den als Required-Context).
          # Reusable-Job heisst 'bridge' → Check-Run 'bridge / bridge' matcht den
          # Required-Context 'bridge' NICHT, daher Status explizit spiegeln.
          for ctx in gate-2-codex bridge; do
            gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/${{ steps.head.outputs.sha }}" \
              -f state=success -f context="$ctx" \
              -f description="$REASON"
          done

      - name: Read Codex Review/Comment (HEAD-bound, PB LLC §3.4 v7.0.0)
        if: steps.head.outputs.bot_exempt != 'true' && steps.scope.outputs.skip != 'true'
        id: codex
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          # --- HEAD-Bindung (v7.0.0): ein Codex-Verdict zählt NUR, wenn es den aktuellen
          # HEAD betraf. Ohne diese Prüfung wird ein "APPROVED" von Commit A auf einen
          # neuen, ungeprüften Commit B übertragen (Stale-Approval-Loch, Audit-Befund). ---
          SHORT_SHA="${HEAD_SHA:0:7}"

          # --- Vollstaendigkeits-Pflicht (v1.6.2, Befund geheimtreffen-site#107) --------
          # (1) BEIDE Abfragen MUESSEN `--paginate` tragen. Ohne das liefert die REST-API
          # nur die erste Seite = 30 Eintraege; GitHub sortiert aufsteigend, das NEUESTE
          # steht also am Ende und faellt als erstes weg. Ein PR mit >30 Kommentaren war
          # damit strukturell unmergebar: das Gate sah null Codex-Kommentare, blieb auf
          # pending und jede weitere Review-Runde schob das Urteil tiefer auf Seite 2.
          # Belegt: #107 (33 Kommentare) -> ohne --paginate kein Verdict, mit --paginate
          # success. #106 (17) und #108 (12) kamen nur durch, weil sie unter 30 lagen.
          #
          # (2) Die Seiten MUESSEN vor der Auswahl zusammengefuehrt werden (`jq -s`), statt
          # `--jq` den Filter je Seite anwenden zu lassen (Codex-P1 auf PR #32). `gh api
          # --paginate` gibt laut Handbuch jede Seite einzeln aus; `sort_by | last` liefert
          # dann ein Ergebnis PRO SEITE — `REVIEW_SHA` wuerde mehrzeilig und koennte nie
          # `HEAD_SHA` gleichen, und ein veraltetes `failure` koennte ein aktuelles
          # `success` ueberschreiben. Neuere gh-Versionen aggregieren Array-Antworten still,
          # aber das ist undokumentiert, versionsabhaengig und gilt fuer Objekt-Antworten
          # (z.B. /actions/runs/*/jobs) ueberhaupt nicht. Deshalb immer explizit slurpen.
          # `(add // [])` ist Pflicht: bei leerer Eingabe liefert `add` `null`.
          # Beweis: scripts/gate-2-paginate-selftest.sh
          # -----------------------------------------------------------------------------

          # Neuestes formales Codex-Review + der EXAKTE Commit, den es begutachtet hat.
          LATEST_REVIEW=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" 2>/dev/null \
            | jq -s '(add // []) | [.[] | select(.user.login == "chatgpt-codex-connector[bot]")] | sort_by(.submitted_at) | last // {}' 2>/dev/null || echo '{}')
          [ -n "$LATEST_REVIEW" ] || LATEST_REVIEW='{}'
          REVIEW_STATE=$(echo "$LATEST_REVIEW" | jq -r '.state // empty')
          REVIEW_SHA=$(echo "$LATEST_REVIEW"   | jq -r '.commit_id // empty')
          REVIEW_BODY=$(echo "$LATEST_REVIEW"  | jq -r '.body // empty')

          # Neuester Codex-Kommentar (Kommentare tragen keine commit_id → HEAD-SHA muss im Body stehen).
          # `-r`, weil `eval_body()` auf Zeilenanfaenge prueft (`^Codex Review: `) — ein
          # gequoteter JSON-String wuerde daran scheitern.
          COMMENT_BODY=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" 2>/dev/null \
            | jq -sr '(add // []) | [.[] | select(.user.login == "chatgpt-codex-connector[bot]")] | sort_by(.created_at) | last | .body // empty' 2>/dev/null || echo "")

          # --- Offene Codex-ZEILENbefunde am HEAD (v1.9.0, llc-ops-backlog#87) ------
          # `Completed` in der Summary-Tabelle heisst nur "Lauf beendet", NICHT
          # "keine Befunde" — Codex-Vorpruefung P1, Runde 3, belegt an
          # llc-ops-backlog#1147: die Summary stand fuer `2293878` auf Completed,
          # waehrend gleichzeitig ein P2-Zeilenbefund offen war. Befunde stehen
          # NICHT im Kommentar-Body, sondern als Review-Kommentare unter
          # /pulls/N/comments — die diese Bruecke bisher nie gelesen hat.
          #
          # Gezaehlt werden nur TOP-LEVEL-Kommentare des Connectors OHNE Antwort:
          # ein beantworteter Befund gilt als abgearbeitet (`in_reply_to_id` zeigt
          # auf den Elternkommentar). Ohne diese Einschraenkung bliebe ein einmal
          # erledigter Befund ewig blockierend — die `commit_id` von
          # Review-Kommentaren wandert beim Push auf den neuen HEAD mit.
          #
          # `--paginate` + `jq -s` mit `(add // [])` sind Pflicht (siehe oben, v1.6.2).
          # Scheitert der Abruf, bleibt der Wert LEER = "unbekannt" und das Gate
          # bleibt `pending`. Leer darf NIE als "null Befunde" gelesen werden.
          CODEX_OFFEN=$(gh api --paginate "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments" 2>/dev/null \
            | jq -s --arg head "$HEAD_SHA" '
                (add // []) as $all
                | ($all | map(select(.in_reply_to_id != null) | .in_reply_to_id) | unique) as $beantwortet
                | [ $all[]
                    | select(.user.login == "chatgpt-codex-connector[bot]")
                    | select(.commit_id == $head)
                    | select(.in_reply_to_id == null)
                    | select([.id] | inside($beantwortet) | not) ]
                | length' 2>/dev/null || echo "")
          case "$CODEX_OFFEN" in ''|*[!0-9]*) CODEX_OFFEN="" ;; esac
          echo "Offene Codex-Zeilenbefunde am HEAD: ${CODEX_OFFEN:-unbekannt}"

          STATE=pending
          DESC="Awaiting Codex review for current HEAD"

          # --- Summary-Kommentar: STATUS auswerten, nicht die Ueberschrift ----------
          # (v1.9.0, llc-ops-backlog#87) Der Regelfall heute ist der editierte
          # Sammel-Kommentar mit dem Marker `<!-- codex-pull-request-review-summary -->`
          # und einer Tabelle je Review-Lauf:
          #   | 📝 **Code Review** | ✅ **Completed** <time…> | `2528273` | PR opened |
          # Die alte Erkennung verlangte genau drei Rauten (`^### Codex Review`) und
          # traf `## Codex Review Summary` nie — `STATE` blieb auf `pending` und
          # ueberschrieb das eigene `success`.
          #
          # ⛔ Die Ueberschrift zu weiten (`^#+`) waere die FALSCHE Reparatur und ist
          # bewusst unterlassen: der Kommentar existiert schon, waehrend der Lauf noch
          # LAEUFT — er wird nur editiert. Eine reine Ueberschriften-Erkennung haette
          # das Tor bei „Running" auf `success` gesetzt und den Merge VOR den Befunden
          # freigegeben (Stale-Green; Codex-Vorpruefung P1, Runde 2).
          # Deshalb: nur eine Tabellenzeile, die den aktuellen HEAD nennt UND
          # `**Completed**` traegt, ist ein Urteil. Alles andere bleibt `pending` —
          # die Irrtumsrichtung zeigt damit auf „zu vorsichtig", nie auf „zu gruen".
          # Beweis: scripts/gate-2-verdict-selftest.sh (Faelle V1-V9).
          eval_body() {  # $1=body  $2=offene Zeilenbefunde am HEAD (leer=unbekannt)
                         #   → echoes success|failure|"" (kein erkennbares Verdict)
            if echo "$1" | grep -qE '### Integrations-Befunde|### Findings|🚨|\*\*P[01]\*\*'; then echo failure
            elif echo "$1" | grep -qF '<!-- codex-pull-request-review-summary -->'; then
              # $2 = offene Codex-Zeilenbefunde am HEAD (Zahl; LEER = unbekannt).
              # Reihenfolge: unbekannt schlaegt alles, dann Befunde, dann der
              # abgeschlossene Lauf. "Completed" allein ist KEIN Freigabesignal.
              if [ -z "${2:-}" ]; then echo ""
              elif [ "$2" -gt 0 ]; then echo failure
              # Nur die Zeile(n) des aktuellen HEAD betrachten; ein abgeschlossener
              # Lauf eines ANDEREN Commits sagt ueber diesen HEAD nichts.
              elif echo "$1" | grep -F -e "$HEAD_SHA" -e "$SHORT_SHA" | grep -qF '**Completed**'; then echo success
              else echo ""; fi
            elif echo "$1" | grep -qE '^### 💡 Codex Review|^### Codex Review|^Codex Review: '; then echo success
            else echo ""; fi
          }

          if [ -n "$REVIEW_SHA" ] && [ "$REVIEW_SHA" = "$HEAD_SHA" ]; then
            # (1) Formales Review gegen den aktuellen HEAD — verbindlich.
            if [ "$REVIEW_STATE" = "APPROVED" ]; then
              STATE=success; DESC="Codex approved HEAD"
            elif [ "$REVIEW_STATE" = "CHANGES_REQUESTED" ]; then
              STATE=failure; DESC="Codex requests changes (HEAD)"
            else
              V=$(eval_body "$REVIEW_BODY" "$CODEX_OFFEN")
              [ "$V" = failure ] && { STATE=failure; DESC="Codex findings (HEAD)"; }
              [ "$V" = success ] && { STATE=success; DESC="Codex review (HEAD): no findings"; }
            fi
          elif [ -n "$COMMENT_BODY" ] && echo "$COMMENT_BODY" | grep -qF -e "$HEAD_SHA" -e "$SHORT_SHA"; then
            # (2) Kommentar-Fallback — nur wenn er den aktuellen HEAD-SHA explizit nennt.
            V=$(eval_body "$COMMENT_BODY" "$CODEX_OFFEN")
            [ "$V" = failure ] && { STATE=failure; DESC="Codex findings (comment@HEAD)"; }
            [ "$V" = success ] && { STATE=success; DESC="Codex comment (HEAD): no findings"; }
            # Offene Zeilenbefunde sind hier der haeufigste Grund fuer failure —
            # sie im Text benennen, sonst sucht man sie im Kommentar-Body.
            if [ "$V" = failure ] && [ -n "$CODEX_OFFEN" ] && [ "$CODEX_OFFEN" -gt 0 ]; then
              DESC="Codex findings (HEAD): $CODEX_OFFEN offene Zeilenkommentare"
            fi
          fi
          # Andernfalls bleibt STATE=pending → Codex re-reviewt den neuen HEAD via Integration;
          # das folgende pull_request_review-Event lässt diese Bridge erneut laufen.
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "desc=$DESC" >> "$GITHUB_OUTPUT"

      - name: Post Status
        if: steps.head.outputs.bot_exempt != 'true' && steps.scope.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ctx in gate-2-codex bridge; do
            gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/${{ steps.head.outputs.sha }}" \
              -f state="${{ steps.codex.outputs.state }}" \
              -f context="$ctx" \
              -f description="${{ steps.codex.outputs.desc }}"
          done

name: Gate 2 Codex (Reusable)

# PB LLC §3.4 Gate 2 — Cross-Vendor-Reviewer-Bridge.
# Reusable-Workflow: Repos pinnen via:
#   jobs:
#     bridge:
#       uses: Paul-Brandenburg-LLC/llc-workflow-templates/.github/workflows/gate-2-codex.yml@v1
#       secrets: inherit

on:
  workflow_call:
    inputs:
      use_app_token:
        description: 'GitHub App-Token für Auto-Push verwenden (Anti-Loop-Schutz)'
        type: boolean
        default: true
        required: false
      extra_doc_only_regex:
        # PB LLC §3.4 v7.0.4 Render-PR-Regel (Realitäts-Audit 2026-07-06): erlaubt einem
        # Consumer, weitere Pfade als doc-only zu deklarieren, die Codex nicht braucht
        # (z.B. gerenderte Spec-HTML). Render-PRs #295/#298 hingen an der Bot-PR-Mention-
        # Lücke, weil ihr Diff hier nicht als doc-only durchging. Leer = kein Extra-Match.
        description: 'Zusätzliches Regex (bash =~), das Pfade als doc-only wertet; leer = deaktiviert'
        type: string
        default: ''
        required: false

permissions:
  pull-requests: read
  statuses: write
  contents: read

concurrency:
  group: gate-2-codex-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  bridge:
    if: >-
      (github.event_name == 'pull_request') ||
      (github.event_name == 'pull_request_review' && github.event.review.user.login == 'chatgpt-codex-connector[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve PR HEAD
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Doc-only Skip (PB LLC §3.4 v5.8 M2)
        id: scope
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          EXTRA_DOC_ONLY_REGEX: ${{ inputs.extra_doc_only_regex }}
        run: |
          set -euo pipefail
          FILES=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path')
          DOC_ONLY=1
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Eine Datei ist doc-only, wenn sie eines der Standard-Muster ODER (falls gesetzt)
            # das Consumer-Extra-Regex matcht (PB LLC §3.4 v7.0.4 Render-PR-Regel).
            if [[ ! "$f" =~ \.(md|markdown)$ ]] && \
               [[ ! "$f" =~ ^docs/ ]] && \
               [[ ! "$f" =~ ^CHANGELOG ]] && \
               [[ ! "$f" =~ ^\.github/ISSUE_TEMPLATE/ ]] && \
               [[ ! "$f" =~ ^feedback_.*\.md$ ]] && \
               { [ -z "$EXTRA_DOC_ONLY_REGEX" ] || [[ ! "$f" =~ $EXTRA_DOC_ONLY_REGEX ]]; }; then
              DOC_ONLY=0; break
            fi
          done <<< "$FILES"
          if [ "$DOC_ONLY" = "1" ]; then
            DIFF=$(gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY")
            if echo "$DIFF" | grep -qE '^[+-]version:'; then
              DOC_ONLY=0
            fi
          fi
          echo "skip=$([ "$DOC_ONLY" = "1" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set status — Doc-only Skip
        if: steps.scope.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Status unter BEIDEN Contexts posten: 'gate-2-codex' (Status-Name) und
          # 'bridge' (= Job-Name; manche Repos haben den als Required-Context).
          # Reusable-Job heisst 'bridge' → Check-Run 'bridge / bridge' matcht den
          # Required-Context 'bridge' NICHT, daher Status explizit spiegeln.
          for ctx in gate-2-codex bridge; do
            gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/${{ steps.head.outputs.sha }}" \
              -f state=success -f context="$ctx" \
              -f description="Doc-only skip"
          done

      - name: Read Codex Review/Comment (HEAD-bound, PB LLC §3.4 v7.0.0)
        if: steps.scope.outputs.skip != 'true'
        id: codex
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          # --- HEAD-Bindung (v7.0.0): ein Codex-Verdict zählt NUR, wenn es den aktuellen
          # HEAD betraf. Ohne diese Prüfung wird ein "APPROVED" von Commit A auf einen
          # neuen, ungeprüften Commit B übertragen (Stale-Approval-Loch, Audit-Befund). ---
          SHORT_SHA="${HEAD_SHA:0:7}"

          # Neuestes formales Codex-Review + der EXAKTE Commit, den es begutachtet hat.
          LATEST_REVIEW=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --jq '[.[] | select(.user.login == "chatgpt-codex-connector[bot]")] | sort_by(.submitted_at) | last // {}' 2>/dev/null || echo '{}')
          REVIEW_STATE=$(echo "$LATEST_REVIEW" | jq -r '.state // empty')
          REVIEW_SHA=$(echo "$LATEST_REVIEW"   | jq -r '.commit_id // empty')
          REVIEW_BODY=$(echo "$LATEST_REVIEW"  | jq -r '.body // empty')

          # Neuester Codex-Kommentar (Kommentare tragen keine commit_id → HEAD-SHA muss im Body stehen).
          COMMENT_BODY=$(gh api "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "chatgpt-codex-connector[bot]")] | sort_by(.created_at) | last | .body // empty' 2>/dev/null || echo "")

          STATE=pending
          DESC="Awaiting Codex review for current HEAD"

          eval_body() {  # $1=body → echoes success|failure|"" (kein erkennbares Verdict)
            if echo "$1" | grep -qE '### Integrations-Befunde|### Findings|🚨|\*\*P[01]\*\*'; then echo failure
            elif echo "$1" | grep -qE '^### 💡 Codex Review|^### Codex Review|^Codex Review: '; then echo success
            else echo ""; fi
          }

          if [ -n "$REVIEW_SHA" ] && [ "$REVIEW_SHA" = "$HEAD_SHA" ]; then
            # (1) Formales Review gegen den aktuellen HEAD — verbindlich.
            if [ "$REVIEW_STATE" = "APPROVED" ]; then
              STATE=success; DESC="Codex approved HEAD"
            elif [ "$REVIEW_STATE" = "CHANGES_REQUESTED" ]; then
              STATE=failure; DESC="Codex requests changes (HEAD)"
            else
              V=$(eval_body "$REVIEW_BODY")
              [ "$V" = failure ] && { STATE=failure; DESC="Codex findings (HEAD)"; }
              [ "$V" = success ] && { STATE=success; DESC="Codex review (HEAD): no findings"; }
            fi
          elif [ -n "$COMMENT_BODY" ] && echo "$COMMENT_BODY" | grep -qF -e "$HEAD_SHA" -e "$SHORT_SHA"; then
            # (2) Kommentar-Fallback — nur wenn er den aktuellen HEAD-SHA explizit nennt.
            V=$(eval_body "$COMMENT_BODY")
            [ "$V" = failure ] && { STATE=failure; DESC="Codex findings (comment@HEAD)"; }
            [ "$V" = success ] && { STATE=success; DESC="Codex comment (HEAD): no findings"; }
          fi
          # Andernfalls bleibt STATE=pending → Codex re-reviewt den neuen HEAD via Integration;
          # das folgende pull_request_review-Event lässt diese Bridge erneut laufen.
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "desc=$DESC" >> "$GITHUB_OUTPUT"

      - name: Post Status
        if: steps.scope.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for ctx in gate-2-codex bridge; do
            gh api -X POST "/repos/$GITHUB_REPOSITORY/statuses/${{ steps.head.outputs.sha }}" \
              -f state="${{ steps.codex.outputs.state }}" \
              -f context="$ctx" \
              -f description="${{ steps.codex.outputs.desc }}"
          done
